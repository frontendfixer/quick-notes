services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: quick_notes
      POSTGRES_USER: quick_notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:
